# Start-point long-press check (route-planning.tsx, lib/mapLongPress.ts):
# a long-press drops the destination; with the start field open it drops the
# START instead, and both pins resolve to a street address.
#
# Run by .github/workflows/ios-simulator-start-long-press.yml. Signs in with the
# App Review demo account from repository secrets (DEMO_EMAIL / DEMO_PASSWORD,
# passed with `-e`) because the planning screen sits behind the signup wall.
# Nothing is submitted: it never previews or starts a route.
#
# The verdict is in the screenshots and the recording. Asserts cover the
# states the feature defines; the address check is a screenshot only, since
# the street name depends on Mapbox data.
appId: com.defensivepedal.mobile
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- setLocation:
    latitude: 44.4268
    longitude: 26.1025
- startRecording: start-long-press
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 01-launched

# ── Onboarding: region check (silent when GPS resolves), signup wall ───────
- runFlow:
    when:
      visible: "Search countries"
    commands:
      - tapOn: "Search countries"
      - inputText: "Romania"
      - tapOn:
          text: "Romania"
          index: 1
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Use email instead"
    timeout: 45000
- tapOn: "Use email instead"
- tapOn: "you@example.com"
- inputText: ${DEMO_EMAIL}
- tapOn: "Minimum 6 characters"
- inputText: ${DEMO_PASSWORD}
- hideKeyboard
- takeScreenshot: 02-credentials
- tapOn:
    text: "Sign in"
    index: -1
- waitForAnimationToEnd:
    timeout: 15000
- takeScreenshot: 03-after-sign-in
- runFlow:
    when:
      visible: "Signed in successfully."
    commands:
      - tapOn:
          point: "9%,9%"
- runFlow:
    when:
      visible: "Skip for now"
    commands:
      - tapOn: "Skip for now"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "Where to?"
    timeout: 45000
- takeScreenshot: 04-planning

# ── 1. Long-press with no field open drops the DESTINATION ─────────────────
- tapOn: "Center on current location"
- waitForAnimationToEnd:
    timeout: 10000
- longPressOn:
    point: "40%,35%"
- extendedWaitUntil:
    visible: "(?i)destination"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 05-destination-dropped

# ── 2. Open the start field: the hint shows, Cancel is reachable ───────────
# The pencil on the origin card (it has no accessibility label to tap by).
- tapOn:
    point: "89%,11%"
- extendedWaitUntil:
    visible: "Or long-press the map to set your start"
    timeout: 10000
- takeScreenshot: 06-start-field-open

# ── 3. Long-press now drops the START ──────────────────────────────────────
# The open start card and the mode pills cover most of the map; this band
# sits between the pills and the Preview route button.
- longPressOn:
    point: "45%,78%"
- extendedWaitUntil:
    visible: "(?i)from · custom start"
    timeout: 20000
- assertNotVisible: "Or long-press the map to set your start"
# Give the reverse geocode time to replace "Dropped pin" with the address.
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: 07-start-dropped
- stopRecording
